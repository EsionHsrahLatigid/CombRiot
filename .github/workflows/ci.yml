name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    name: macOS arm64
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Debug tests
        run: cmake --preset engine-debug

      - name: Build Debug tests
        run: cmake --build --preset engine-debug --parallel

      - name: Run Debug tests
        run: ctest --preset engine-debug --output-on-failure

      - name: Configure Release bundles
        run: cmake --preset plugin-release

      - name: Build Release bundles
        run: >
          cmake --build build/plugin-release --config Release --parallel
          --target combriot_engine_tests
          combriot_standalone_plugin
          combriot_vst3_plugin
          combriot_au_plugin

      - name: Run Release tests
        run: ctest --preset plugin-release --output-on-failure

      - name: Verify macOS bundles
        run: |
          test -d build/plugin-release/combriot_standalone_plugin.app
          test -d build/plugin-release/VST3/Release/combriot_vst3_plugin.vst3
          test -d build/plugin-release/combriot_au_plugin.component
          codesign --verify --deep --strict build/plugin-release/combriot_standalone_plugin.app
          codesign --verify --deep --strict build/plugin-release/VST3/Release/combriot_vst3_plugin.vst3
          codesign --verify --deep --strict build/plugin-release/combriot_au_plugin.component

      - name: Package macOS bundles
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/CombRiot-macos-arm64
          ditto build/plugin-release/combriot_standalone_plugin.app dist/CombRiot-macos-arm64/combriot_standalone_plugin.app
          ditto build/plugin-release/VST3/Release/combriot_vst3_plugin.vst3 dist/CombRiot-macos-arm64/combriot_vst3_plugin.vst3
          ditto build/plugin-release/combriot_au_plugin.component dist/CombRiot-macos-arm64/combriot_au_plugin.component
          ditto -c -k --sequesterRsrc --keepParent dist/CombRiot-macos-arm64 dist/CombRiot-latest-macos-arm64.zip

      - name: Upload macOS latest ZIP
        uses: actions/upload-artifact@v7
        with:
          name: CombRiot-latest-macos-arm64
          path: dist/CombRiot-latest-macos-arm64.zip
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Debug tests
        shell: pwsh
        run: >
          cmake -S . -B build/windows-debug
          -G "Visual Studio 18 2026" -A x64
          -DCOMBRIOT_BUILD_PLUGIN=OFF
          -DCOMBRIOT_BUILD_TESTS=ON

      - name: Build Debug tests
        shell: pwsh
        run: cmake --build build/windows-debug --config Debug --parallel --target combriot_engine_tests

      - name: Run Debug tests
        shell: pwsh
        run: ctest --test-dir build/windows-debug -C Debug --output-on-failure

      - name: Configure Release bundles
        shell: pwsh
        run: >
          cmake -S . -B build/windows-release
          -G "Visual Studio 18 2026" -A x64
          -DCOMBRIOT_BUILD_PLUGIN=ON
          -DCOMBRIOT_BUILD_TESTS=ON

      - name: Build Release bundles
        shell: pwsh
        run: >
          cmake --build build/windows-release --config Release --parallel
          --target combriot_engine_tests
          combriot_standalone_plugin
          combriot_vst3_plugin

      - name: Run Release tests
        shell: pwsh
        run: ctest --test-dir build/windows-release -C Release --output-on-failure

      - name: Package Windows bundles
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist/CombRiot-windows-x64 | Out-Null
          $standalone = Get-ChildItem build/windows-release -Recurse -File -Filter combriot_standalone_plugin.exe | Select-Object -First 1
          $vst3 = Get-ChildItem build/windows-release -Recurse -Directory -Filter combriot_vst3_plugin.vst3 | Select-Object -First 1
          if (-not $standalone) { throw "Missing CombRiot standalone executable" }
          if (-not $vst3) { throw "Missing CombRiot VST3 bundle" }
          Copy-Item $standalone.FullName dist/CombRiot-windows-x64/
          Copy-Item $vst3.FullName dist/CombRiot-windows-x64/ -Recurse
          Compress-Archive -Path dist/CombRiot-windows-x64 -DestinationPath dist/CombRiot-latest-windows-x64.zip -Force

      - name: Upload Windows latest ZIP
        uses: actions/upload-artifact@v7
        with:
          name: CombRiot-latest-windows-x64
          path: dist/CombRiot-latest-windows-x64.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - macos-arm64
      - windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare versioned ZIPs
        run: |
          set -euo pipefail
          version="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')"
          cp artifacts/CombRiot-latest-macos-arm64/CombRiot-latest-macos-arm64.zip "CombRiot-$version-macos-arm64.zip"
          cp artifacts/CombRiot-latest-windows-x64/CombRiot-latest-windows-x64.zip "CombRiot-$version-windows-x64.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||             gh release create "$GITHUB_REF_NAME" --verify-tag --title "CombRiot $version" --generate-notes
          gh release upload "$GITHUB_REF_NAME"             "CombRiot-$version-macos-arm64.zip"             "CombRiot-$version-windows-x64.zip"             --clobber
